<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Gromm</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      /* Dokunmatikte kaydırma, yakınlaştırma ve seçim olmasın */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      image-rendering: optimizeSpeed;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      -ms-interpolation-mode: nearest-neighbor;
      cursor: crosshair;
    }
    #old, #file {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      top: 40%;
      padding: 1em;
      color: #d8c8a8;
      font-family: monospace;
      font-size: 16px;
      text-align: center;
      line-height: 1.5;
    }
    #old small {
      color: #8a7e70;
      word-break: break-all;
    }
    #file a {
      color: #ffd970;
    }
    noscript {
      color: #ccc;
      font-family: monospace;
      display: block;
      padding: 2em;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <noscript>Bu oyun için JavaScript gerekli.</noscript>
  <div id="old">Bu tarayıcı oyunu açmak için çok eski. Lütfen tarayıcını güncelle ya da başka bir tarayıcı dene.<br><br><small id="ua"></small></div>
  <div id="file">Oyunu dosyadan açtın. Bu sürüm sadece internet linkiyle çalışır. İnternetsiz oynamak için <b>gromm-offline.html</b> dosyasını kullan ya da şu linkten aç:<br><br><a href="https://mirzadogan44.github.io/maden15temmuz/">https://mirzadogan44.github.io/maden15temmuz/</a></div>
  <script>
    // Modern tarayıcılar kaynak kodu (src/) doğrudan modül olarak yükler.
    // Yeni sözdizimini (?. ?? ... catch{}) ya da modülleri tanımayan eski
    // tarayıcılar, ES2015'e çevrilmiş tek dosyalık sürümü (legacy/gromm.js) yükler.
    // Test için ?legacy eski sürümü zorlar.
    (function () {
      // Dosyadan (file://) açıldıysa: modüller ve görseller bu şekilde çalışmaz.
      // "Tarayıcı eski" demek yanlış olur; çevrimdışı sürümü göster.
      if (location.protocol === 'file:') {
        document.getElementById('file').style.display = 'block';
        return;
      }
      var modern = false;
      try {
        modern = 'noModule' in document.createElement('script') &&
          !!new Function('var a = { ...{ b: 1 } }; var c = a?.b ?? 0; a.d ||= 1; try {} catch {} return c;');
      } catch (e) {
        modern = false;
      }
      if (/[?&]legacy\b/.test(location.search)) modern = false;
      var s = document.createElement('script');
      if (modern) {
        s.type = 'module';
        s.src = 'src/main.js';
      } else {
        s.src = 'legacy/gromm.js';
      }
      document.body.appendChild(s);
      // Eski sürüm de çalışmadıysa (gerçekten çok eski tarayıcı) uyarı ve tarayıcı bilgisi.
      // Modern yolda bekleme süresini uzun tut: yavaş bağlantıda yanlış uyarı çıkmasın.
      setTimeout(function () {
        if (window.__grommStarted) return;
        document.getElementById('ua').textContent = navigator.userAgent;
        document.getElementById('old').style.display = 'block';
      }, modern ? 20000 : 8000);
    })();
  </script>
</body>
</html>
